<nav class="nav-bar">
	<a class="brand" href="{{ site.url }}/">
		<img class="logo" alt="{{ site.title }}" src="{% if site.external-image %}{{ site.picture }}{% else %}{{ site.url }}/{{ site.picture }}{% endif %}" />
		<span class="name">{{ site.title }}</span>
	</a>
	<ul class="list">
		{% if site.blog == true %}
		<li class="item"><a class="link {% if page.title == "Blog" %}active{% endif %}" href="{{ site.url }}/blog">Blog</a></li>
		{% endif %}
		{% if site.tools == true %}
		<li class="item"><a class="link {% if page.title == "Tools" %}active{% endif %}" href="{{ site.url }}/tools">Tools</a></li>
		{% endif %}
		<li class="item"><a class="link {% if page.title == "Services" %}active{% endif %}" href="{{ site.url }}/services">Services</a></li>
		{% if site.about == true %}
		<li class="item"><a class="link {% if page.title == "About" %}active{% endif %}" href="{{ site.url }}/about">About</a></li>
		{% endif %}
	</ul>
</nav>
