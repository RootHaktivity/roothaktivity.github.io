<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ page.title }} | RootHaktivity</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
</head>
<body style="margin:0;padding:0;">
	<!-- Fullscreen purple background texture -->
	<div class="bg-overlay"></div>

	<!-- Navigation bar -->
	<nav class="main-nav">
		<a href="{{ '/' | relative_url }}" class="nav-brand">
			<img src="{{ '/assets/images/Root-HaktivityPurple.png' | relative_url }}" alt="Logo" style="width: 32px; height: 32px; border-radius: 50%;" />
			<span>RootHaktivity</span>
		</a>
		
		<!-- Hamburger Icon -->
		<div class="menu-toggle" id="mobile-menu">
			<span class="bar"></span>
			<span class="bar"></span>
			<span class="bar"></span>
		</div>

		<div class="nav-menu-container">
			<ul class="nav-links">
				<li><a href="{{ '/' | relative_url }}">HOME</a></li>
				<li><a href="{{ '/about/' | relative_url }}">ABOUT</a></li>
				<li><a href="{{ '/tools/' | relative_url }}">TOOLS</a></li>
				<li><a href="{{ '/services/' | relative_url }}">SERVICES</a></li>
				<li><a href="{{ '/contact/' | relative_url }}">CONTACT</a></li>
				<li><a href="{{ 'radio.html' | relative_url }}">RADIO</a></li>
			</ul>
			<div class="nav-socials">
				<a href="https://www.youtube.com/@roothaktivity5053" target="_blank" class="social-icon"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg" alt="YouTube" /></a>
				<a href="https://discord.com/invite/yYY57NMdmW" target="_blank" class="social-icon"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/discord.svg" alt="Discord" /></a>
			</div>
		</div>
	</nav>

	<main style="position:relative;z-index:10;">
		{{ content }}
	</main>

	<script>
		const menu = document.querySelector('#mobile-menu');
		const menuContainer = document.querySelector('.nav-menu-container');

		menu.addEventListener('click', function() {
			menu.classList.toggle('is-active');
			menuContainer.classList.toggle('active');
		});
	</script>
</body>
</html>
