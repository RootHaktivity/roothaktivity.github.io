---
layout: default
---

<style>
  /* Radio page — built on the existing RootHaktivity theme
     (.page-main + .page-title come from style.css, colors come from theme variables) */

  .radio-eyebrow {
    color: var(--muted);
    font-size: 0.8em;
    letter-spacing: 3px;
    margin: 0;
  }

  .radio-tagline {
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: -20px;
  }

  .radio-player {
    background: var(--surface);
    border: 2px solid var(--primary);
    box-shadow: var(--glow-pink);
    padding: 28px;
    margin-top: 30px;
  }

  .radio-controls {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .radio-button {
    border: 2px solid var(--accent);
    background: var(--accent);
    color: #000;
    padding: 14px 22px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 900;
    letter-spacing: 1px;
    box-shadow: var(--glow-green);
    text-decoration: none;
    text-align: center;
  }

  .radio-button:hover {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: var(--glow-pink);
  }

  .radio-status {
    color: var(--muted);
    font-size: 0.85em;
    letter-spacing: 1px;
  }

  #radio-direct {
    display: none;
  }

  .radio-badge-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 25px;
  }

  .radio-badge {
    color: var(--muted);
    font-size: 0.8em;
    font-weight: 900;
    letter-spacing: 2px;
    animation: badge-pulse 2s infinite;
  }

  @keyframes badge-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .radio-badge { animation: none; }
  }

  .radio-listeners {
    color: var(--muted);
    font-size: 0.8em;
    letter-spacing: 1px;
  }

  .radio-panel {
    display: none;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--primary);
  }

  .radio-label {
    color: var(--muted);
    font-size: 0.75em;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  #radio-song {
    color: var(--text);
    font-weight: 700;
    font-size: 1.05em;
  }

  .radio-history ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .radio-history li {
    display: flex;
    gap: 14px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(209, 63, 198, 0.25);
    font-size: 0.85em;
  }

  .history-time {
    color: var(--muted);
    white-space: nowrap;
  }

  .history-title {
    color: var(--text);
  }

  .radio-volume {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid var(--primary);
    color: var(--muted);
  }

  .radio-volume input {
    accent-color: var(--accent);
  }

  @media (max-width: 600px) {
    .radio-button {
      width: 100%;
    }
  }
</style>

<main class="page-main">
  <p class="radio-eyebrow">ROOTHAKTIVITY // LIVE TRANSMISSION</p>
  <h1 class="page-title">RADIO</h1>
  <p class="radio-tagline">Independent signal // no unnecessary noise</p>

  <section class="radio-player">
    <div class="radio-controls">
      <button id="radio-toggle" class="radio-button" type="button">
        ▶ PLAY STREAM
      </button>

      <a id="radio-direct" class="radio-button"
         href="https://srv.akumadistrict.com:8150/radio.mp3" target="_blank" rel="noopener">
        OPEN IN PLAYER
      </a>

      <span id="radio-status" class="radio-status">STANDBY</span>
    </div>

    <div class="radio-badge-row">
      <span id="radio-badge" class="radio-badge">● CHECKING</span>
      <span id="radio-listeners" class="radio-listeners"></span>
    </div>

    <div id="radio-now" class="radio-panel">
      <div class="radio-label">NOW PLAYING</div>
      <div id="radio-song">—</div>
    </div>

    <div id="radio-history" class="radio-panel radio-history">
      <div class="radio-label">RECENTLY PLAYED</div>
      <ul id="radio-history-list"></ul>
    </div>

    <label class="radio-volume">
      VOLUME
      <input id="radio-volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </label>

    <audio id="radio-audio" preload="none"></audio>
  </section>
</main>

<script>
  const audio = document.getElementById('radio-audio');
  const toggle = document.getElementById('radio-toggle');
  const status = document.getElementById('radio-status');
  const volume = document.getElementById('radio-volume');
  const directLink = document.getElementById('radio-direct');
  const badge = document.getElementById('radio-badge');
  const listenersEl = document.getElementById('radio-listeners');
  const nowBox = document.getElementById('radio-now');
  const songEl = document.getElementById('radio-song');
  const historyBox = document.getElementById('radio-history');
  const historyList = document.getElementById('radio-history-list');

  // AzuraCast AutoDJ listener stream and station API.
  const STREAM_URL = 'https://srv.akumadistrict.com:8150/radio.mp3';
  const NOW_PLAYING_API = 'https://srv.akumadistrict.com/api/nowplaying/stashbox21';
  let streamLoaded = false;

  audio.volume = volume.value;

  volume.addEventListener('input', function () {
    audio.volume = this.value;
  });

  function loadStream() {
    if (streamLoaded) return;
    audio.src = STREAM_URL;
    directLink.href = STREAM_URL;
    audio.load();
    streamLoaded = true;
  }

  function renderHistory(items) {
    historyList.innerHTML = '';
    items.forEach(function (item) {
      const li = document.createElement('li');
      const time = document.createElement('span');
      time.className = 'history-time';
      const playedAt = Number(item.played_at);
      time.textContent = playedAt
        ? new Date(playedAt * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
        : '';
      const title = document.createElement('span');
      title.className = 'history-title';
      title.textContent = item.song && (item.song.text || item.song.title)
        ? (item.song.text || item.song.title)
        : 'Unknown track';
      li.appendChild(time);
      li.appendChild(title);
      historyList.appendChild(li);
    });
  }

  async function refreshStatus() {
    if (document.hidden) return;
    try {
      const res = await fetch(NOW_PLAYING_API, { cache: 'no-store' });
      if (!res.ok) throw new Error('Now Playing request failed: ' + res.status);
      const data = await res.json();
      const station = data.station || {};
      const nowPlaying = data.now_playing || {};
      const song = nowPlaying.song || {};
      const listenerCount = data.listeners && data.listeners.current;
      const mount = (station.mounts || []).find(function (item) { return item.is_default; });
      const bitrate = mount && mount.bitrate;

      if (data.is_online) {
        badge.textContent = '● ONLINE';
        badge.style.color = 'var(--accent)';
        listenersEl.textContent =
          (listenerCount || 0) + ' LISTENING' +
          (bitrate ? ' · ' + bitrate + ' KBPS' : '');
        if (song.text || song.title) {
          songEl.textContent = song.text || song.title;
          nowBox.style.display = 'block';
        } else {
          nowBox.style.display = 'none';
        }
        const history = data.song_history || [];
        if (history.length) {
          renderHistory(history);
          historyBox.style.display = 'block';
        } else {
          historyBox.style.display = 'none';
        }
        if (audio.paused) {
          status.textContent = 'ONLINE';
          status.style.color = 'var(--muted)';
        }
      } else {
        badge.textContent = '● OFFLINE';
        badge.style.color = 'var(--primary)';
        listenersEl.textContent = '';
        nowBox.style.display = 'none';
        historyBox.style.display = 'none';
        if (audio.paused) {
          status.textContent = 'OFFLINE';
          status.style.color = 'var(--primary)';
        }
      }
    } catch (e) {
      badge.textContent = '● STATUS UNAVAILABLE';
      badge.style.color = 'var(--muted)';
      listenersEl.textContent = '';
      nowBox.style.display = 'none';
      historyBox.style.display = 'none';
      if (audio.paused) {
        status.textContent = 'STATUS CHECK FAILED';
        status.style.color = 'var(--muted)';
      }
    }
  }

  setInterval(refreshStatus, 20000);
  refreshStatus();

  toggle.addEventListener('click', async function () {
    if (audio.paused) {
      try {
        loadStream();
        await audio.play();
        toggle.textContent = 'Ⅱ PAUSE STREAM';
        status.textContent = 'ON AIR';
        status.style.color = 'var(--accent)';
        refreshStatus();
      } catch (error) {
        status.textContent = 'STREAM BLOCKED OR UNAVAILABLE';
        status.style.color = 'var(--primary)';
        directLink.style.display = 'inline-block';
      }
    } else {
      audio.pause();
      toggle.textContent = '▶ PLAY STREAM';
      status.textContent = 'PAUSED';
      status.style.color = 'var(--muted)';
      refreshStatus();
    }
  });

  audio.addEventListener('error', function () {
    status.textContent = 'STREAM ERROR';
    status.style.color = 'var(--primary)';
    directLink.style.display = 'inline-block';
  });
</script>
