---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RootHaktivity Radio</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .radio-page {
      max-width: 900px;
      margin: 100px auto;
      padding: 30px;
    }

    .radio-player {
      background: var(--surface);
      border: 2px solid var(--primary);
      padding: 28px;
      box-shadow: var(--glow-pink);
      font-family: 'Space Mono', monospace;
    }

    .radio-player-header {
      color: var(--accent);
      border-bottom: 1px solid var(--primary);
      padding-bottom: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .radio-player h1 {
      color: var(--primary);
      text-shadow: var(--glow-pink);
      margin: 25px 0 5px;
    }

    .radio-player p {
      color: var(--muted);
    }

    .radio-controls {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .radio-button {
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #000;
      padding: 14px 22px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: var(--glow-green);
    }

    .radio-button:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: var(--glow-pink);
    }

    .radio-status {
      color: var(--muted);
      font-size: 0.85em;
      letter-spacing: 1px;
    }

    .radio-volume {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--primary);
      color: var(--muted);
    }

    .radio-volume input {
      accent-color: var(--accent);
    }

    /* NEW: hidden fallback link, shown only if every stream URL fails */
    #radio-direct {
      display: none;
      text-decoration: none;
      text-align: center;
    }

    @media (max-width: 600px) {
      .radio-page {
        margin: 90px 15px 30px;
        padding: 10px;
      }

      .radio-player {
        padding: 20px;
      }

      .radio-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="bg-overlay"></div>

  <main class="radio-page">
    <section class="radio-player">
      <div class="radio-player-header">
        ROOTHAKTIVITY // LIVE TRANSMISSION
      </div>

      <h1>RootHaktivity Radio</h1>
      <p>Independent signal // no unnecessary noise</p>

      <div class="radio-controls">
        <button id="radio-toggle" class="radio-button" type="button">
          ▶ PLAY STREAM
        </button>

        <a id="radio-direct" class="radio-button" type="button"
           href="http://sl4.streamhood.net:8100/;" target="_blank" rel="noopener">
          OPEN IN PLAYER
        </a>

        <span id="radio-status" class="radio-status">
          STANDBY
        </span>
      </div>

      <label class="radio-volume">
        VOLUME
        <input id="radio-volume" type="range" min="0" max="1" step="0.01" value="0.8">
      </label>

      <audio id="radio-audio" preload="none"></audio>
    </section>
  </main>

  <script>
    const audio = document.getElementById('radio-audio');
    const toggle = document.getElementById('radio-toggle');
    const status = document.getElementById('radio-status');
    const volume = document.getElementById('radio-volume');
    const directLink = document.getElementById('radio-direct');

    // CHANGED: HTTPS worker proxy first (works on GitHub Pages),
    // original HTTP stream as fallback
    const streamCandidates = [
      'https://winter-mountain-b15d.roothaktivity.workers.dev/',
      'http://sl4.streamhood.net:8100/;'
    ];
    let candidateIndex = 0;

    audio.volume = volume.value;

    volume.addEventListener('input', function () {
      audio.volume = this.value;
    });

    function tryNextStream() {
      if (candidateIndex < streamCandidates.length) {
        audio.src = streamCandidates[candidateIndex];
        candidateIndex++;
        audio.load();
        return true;
      }
      return false;
    }

    toggle.addEventListener('click', async function () {
      if (audio.paused) {
        candidateIndex = 0;
        directLink.style.display = 'none';
        status.textContent = 'TUNING...';
        status.style.color = '#c7b6d9';
        tryNextStream();

        try {
          await audio.play();

          toggle.textContent = 'Ⅱ PAUSE STREAM';
          status.textContent = 'ON AIR';
          status.style.color = '#39ff14';
        } catch (error) {
          status.textContent = 'STREAM BLOCKED OR UNAVAILABLE';
          status.style.color = '#d13fc6';
          directLink.style.display = 'inline-block';
        }
      } else {
        audio.pause();

        toggle.textContent = '▶ PLAY STREAM';
        status.textContent = 'PAUSED';
        status.style.color = '#c7b6d9';
      }
    });

    audio.addEventListener('error', function () {
      // try the next URL in the list before giving up
      if (candidateIndex < streamCandidates.length) {
        tryNextStream();
        audio.play().catch(function () {});
        return;
      }
      status.textContent = 'STREAM ERROR';
      status.style.color = '#d13fc6';
      directLink.style.display = 'inline-block';
    });
  </script>
</body>
</html>
